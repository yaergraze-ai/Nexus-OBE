name: Verify NEXUS OBE
on:
  pull_request:
  push:
    branches: [main, staging]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-fund; fi
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
