<body><div class="portal"><aside class="sidebar"><div class="brand"><div class="brand-mark">N</div><div class="brand-words">NEXUS <span style="color:var(--wine)">OBE</span><small>ACADEMIC PORTAL</small></div></div><div class="side-title">Menu Utama</div><nav id="nav" class="nav-links"></nav><div class="side-bottom"><div class="side-profile"><div class="avatar" id="avatar">KN</div><div style="flex:1"><strong id="who">KANA NURHANA</strong><span id="roleName">Mahasiswa</span></div></div></div></aside><div class="mainwrap"><div class="demo-ribbon">PRATINJAU MANDIRI · Data PRD, seluruh aksi hanya simulasi lokal · Proyek full-stack tersedia dalam file ZIP</div><header class="topbar"><div class="topbar-left"><span class="mobile-menu"><span class="brand-mark">N</span>NEXUS OBE</span><div class="breadcrumbs">Portal Akademik › <strong id="crumb">Dashboard</strong></div></div><div class="topbar-right"><select id="role" class="select tiny" aria-label="Pilih peran"><option value="mahasiswa">Mahasiswa</option><option value="dosen">Dosen</option><option value="admin">Admin Akademik</option><option value="super_admin">Super Admin</option></select><div class="top-pill">2026/2027 Ganjil</div><div class="top-pill clock" id="clock">WIB</div></div></header><main class="content" id="screen"></main></div><nav class="bottomnav" id="bottom"></nav></div>
<script>
const classes=[["TIF-313", "Interaksi Manusia & Komputer", "TI25D", "MUHAMAD IMAM", "Senin", "10:30", "13:00", "G. Mahdar R. D 403", 3, 16, 2, 1], ["NEX-002", "Analisis dan Design PL", "TI24D", "DIAN NOVIANTI", "Senin", "13:00", "15:30", "G. Mahdar R. D 406", 3, 16, 3, 1], ["NEX-003", "Pemrograman Berbasis Platform", "TI24D", "SUDIYANTO", "Senin", "10:00", "12:30", "G. Mahdar R. D 406", 3, 16, 3, 1], ["NEX-004", "Tata Tulis Ilmiah (Metodologi Penelitian)", "TI24D", "HARRY GUNAWAN", "Selasa", "07:30", "09:10", "G. Mahdar R. D 405", 2, 7, 2, 1], ["NEX-005", "Manajemen Proyek Teknologi Informasi", "TI24D", "GUNADI DWI HANTORO", "Senin", "07:30", "10:00", "G. Mahdar R. D 406", 3, 16, 0, 0], ["NEX-006", "AIK 4 (Islam dan Ilmu Pengetahuan)", "TI24D", "MASDUM MUSTAQWA", "Kamis", "10:00", "11:40", "G. Mahdar R. D 405", 2, 16, 3, 1], ["NEX-007", "AI Computing Platform", "24K2B", "FREDDY WICAKSONO", "Rabu", "19:00", "22:00", "G. Mahdar R. C 303", 3, 16, 2, 1], ["NEX-008", "Teknologi AR/VR", "24K2B", "MUHAMAD IMAM", "Selasa", "13:00", "15:30", "G. Mahdar R. D 405", 3, 16, 2, 1]];
const roles={mahasiswa:['KANA NURHANA','Mahasiswa'],dosen:['MUHAMAD IMAM','Dosen'],admin:['ADMIN AKADEMIK','Admin Akademik'],super_admin:['SUPER ADMIN','Super Admin']};
const menu=[['dashboard','Dashboard','◫'],['kelas','Kelas Kuliah','▣'],['jadwal','Jadwal Akademik','▦'],['tugas','Tugas & Pengumpulan','✎'],['pengumuman','Pengumuman','◉'],['nilai','Kalkulator Nilai','◈'],['rps','Validasi RPS','✓'],['notifikasi','Notifikasi','◉'],['akun','Pengaturan','⚙']];
let role='mahasiswa',page='dashboard',selected=0,scores={attendance:90,uts:80,uas:88,daily_task:90,group_task:83,major_project:92},live=false,checked=false;
const $=sel=>document.querySelector(sel);
function tag(ok){return `<span class="tag ${ok?'good':'warn'}">${ok?'✓ RPS Tervalidasi':'◈ RPS Terkunci'}</span>`}
function head(eye,title,desc){return `<div class="sectionhead"><div><span class="kicker">${eye}</span><h1>${title}</h1><p>${desc}</p></div></div>`}
function setup(){let nav=menu.filter(m=>!(m[0]==='rps'&&!['admin','super_admin'].includes(role)));$('#nav').innerHTML=nav.map(([id,label,icon])=>`<button class="nav-link ${page===id?'active':''}" onclick="go('${id}')"><i>${icon}</i><span>${label}</span></button>`).join('');$('#bottom').innerHTML=['dashboard','tugas','pengumuman','notifikasi'].map(id=>menu.find(m=>m[0]===id)).map(([id,label,icon])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><i>${icon}</i>${label.split(' ')[0]}</button>`).join('');$('#who').textContent=roles[role][0];$('#roleName').textContent=roles[role][1];$('#avatar').textContent=roles[role][0].split(' ').slice(0,2).map(t=>t[0]).join('');$('#crumb').textContent=menu.find(m=>m[0]===page)?.[1]||'Detail Kelas';}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function dashboard(){const count=classes.filter(x=>x[11]).length,sks=classes.reduce((v,x)=>v+x[8],0),meetings=classes.reduce((v,x)=>v+x[10],0);return `${head('▦ OVERVIEW AKADEMIK','Dashboard '+roles[role][1],'Semester Ganjil · Tahun Akademik 2026/2027')}<section class="hero"><div class="hero-copy"><span class="hero-brow">NEXUS OBE · AKADEMIK TERPADU</span><h1>Selamat datang, ${roles[role][0].split(' ')[0]}!</h1><p>Kelola jadwal perkuliahan, presensi, dan pencapaian pembelajaran dalam satu portal akademik.</p></div><div class="hero-decor">N</div></section><div class="metrics">${[['▣','Mata Kuliah',classes.length,'Semester aktif'],['◈','Total SKS',sks,'Beban kredit'],['✓','RPS Tervalidasi',count+'/'+classes.length,'Kaprodi & Dekan'],['▦','Pertemuan',meetings,'Rekap awal PRD']].map(([icon,label,value,foot])=>`<div class="metric"><div class="metric-icon">${icon}</div><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`).join('')}</div><div class="two-col"><div class="panel"><div class="panelhead"><h2>Jadwal Perkuliahan</h2><button class="btn btn-secondary btn-sm" onclick="go('jadwal')">Lihat jadwal</button></div>${classes.slice(0,4).map((c,i)=>`<div class="class-row"><div class="class-mini-icon">▣</div><div class="class-row-info"><button style="border:0;background:none;text-align:left;cursor:pointer" onclick="detail(${i})"><strong>${c[1]}</strong></button><span>${c[2]} · ${c[7]}</span></div><div class="class-time"><strong>${c[5]}–${c[6]}</strong><span>${c[4]}</span></div></div>`).join('')}</div><div class="stack"><div class="panel"><div class="panelhead"><h2>Status Semester</h2><span class="tag blue">2026/2027 Ganjil</span></div><div class="stat-line"><span>Fakultas</span><strong>Teknik</strong></div><div class="stat-line"><span>Program Studi</span><strong>Teknik Informatika</strong></div><div class="stat-line"><span>RPS tervalidasi</span><strong>${count}/${classes.length}</strong></div><div class="progress" style="margin-top:15px"><span style="width:${count/classes.length*100}%"></span></div></div><div class="panel"><h2>Pengingat Akademik</h2><div class="notice"><i>ⓘ</i><div><strong>Manajemen Proyek TI</strong><p>RPS kelas TI24D belum divalidasi. Pertemuan tetap terkunci sampai persetujuan selesai.</p></div></div></div></div></div>`}
function cards(){const q=($('#searchClass')?.value||'').toLowerCase();let visible=classes.map((c,i)=>[c,i]).filter(([c])=>(c[1]+' '+c[2]+' '+c[3]).toLowerCase().includes(q));return `<div class="class-grid">${visible.map(([c,i])=>`<article class="class-card"><div class="class-card-top"><span class="course-code">${c[0]} / ${c[2]}</span>${tag(c[11])}</div><h3 class="course-title">${c[1]}</h3><div class="class-meta"><div>♙ &nbsp; ${c[3]}</div><div>▦ &nbsp; ${c[4]}, ${c[5]}–${c[6]}</div><div>⌖ &nbsp; ${c[7]}</div></div><div style="display:flex;justify-content:space-between;font-size:11px"><span class="subtle">Pertemuan</span><strong>${c[10]}/${c[9]}</strong></div><div class="progress"><span style="width:${c[10]/c[9]*100}%"></span></div><div class="class-card-bottom"><span class="tag neutral">${c[8]} SKS</span><button class="btn btn-secondary btn-sm" onclick="detail(${i})">Detail Kelas ↗</button></div></article>`).join('')}</div>${visible.length===0?'<div class="empty"><h3>Belum ada kelas</h3></div>':''}`}
function classPage(){return `${head('KATALOG PERKULIAHAN','Kelas Kuliah','Delapan kelas sesuai PRD · Semester Ganjil 2026/2027')}<div class="filters"><label class="search">⌕ <input id="searchClass" aria-label="Cari mata kuliah" placeholder="Cari mata kuliah atau dosen" oninput="$('#cards').innerHTML=cards()"></label></div><div id="cards">${cards()}</div>`}
function detail(i){selected=i;go('detail')}
function detailPage(){let c=classes[selected];return `<button class="btn btn-secondary btn-sm" onclick="go('kelas')">‹ Kembali ke Kelas</button><div class="hero-sub" style="margin-top:20px"><div><div class="kicker">${c[0]} · ${c[2]}</div><h1>${c[1]}</h1>${tag(c[11])}</div><span class="tag neutral">${c[8]} SKS</span></div><div class="details-grid"><div class="stack"><div class="panel"><div class="panelhead"><h2>Live Class & Presensi</h2><span class="tag ${live?'live':'neutral'}">${live?'LIVE':'Tidak aktif'}</span></div>${!c[11]?'<div class="notice"><i>!</i><div><strong>RPS belum tervalidasi</strong><p>Mulai Pertemuan dinonaktifkan sampai Kaprodi & Dekan menyetujui RPS.</p></div></div>':''}${role==='dosen'?`<button class="btn btn-primary" ${!c[11]||live?'disabled':''} onclick="live=true;render()">Mulai Pertemuan (simulasi)</button> <button class="btn btn-secondary" ${!live?'disabled':''} onclick="live=false;render()">Akhiri Sesi</button>`:role==='mahasiswa'?`<button class="btn btn-primary" ${!live||checked?'disabled':''} onclick="checked=true;render()">${checked?'Presensi tercatat':'Absen Sekarang'}</button>`:'<p class="subtle">Mode simulasi, tidak menulis data produksi.</p>'}</div><div class="panel"><h2>Rekap BAP</h2><div class="stat-line"><span>Pertemuan terlaksana PRD</span><strong>${c[10]}</strong></div><div class="stat-line"><span>Target RPS</span><strong>${c[9]}</strong></div><div class="progress"><span style="width:${c[10]/c[9]*100}%"></span></div><p class="field-hint" style="margin-top:14px">Foto dan BAP historis tidak disertakan dalam PRD.</p></div></div><div class="stack"><div class="panel"><h2>Informasi Kelas</h2>${[['Kode MK',c[0]],['Dosen',c[3]],['Kelas',c[2]],['Jadwal',c[4]+' '+c[5]+'–'+c[6]],['Ruangan',c[7]],['Peserta (rekap)',c[0]==='NEX-006'?'26':c[0]==='NEX-007'?'11':c[0]==='NEX-008'?'31':'30']].map(([k,v])=>`<div class="stat-line"><span>${k}</span><strong>${v}</strong></div>`).join('')}</div><div class="panel"><h2>Evaluasi OBE</h2><p class="subtle">Lihat simulasi dua rumus perhitungan PAP dan CPL.</p><button class="btn btn-blue" onclick="go('nilai')">Buka Kalkulator</button></div></div></div>`}
function schedule(){return `${head('KALENDER AKADEMIK','Jadwal Kuliah','Jadwal mingguan dan ruangan · WIB')}${['Senin','Selasa','Rabu','Kamis'].map(day=>`<section class="panel" style="margin-bottom:18px"><div class="panelhead"><h2>${day}</h2></div><div class="table-scroll"><table class="table"><thead><tr><th>Waktu</th><th>Mata Kuliah</th><th>Kelas</th><th>Ruangan</th></tr></thead><tbody>${classes.filter(c=>c[4]===day).map(c=>`<tr><td><strong>${c[5]}–${c[6]}</strong></td><td>${c[1]}<div class="tiny subtle">${c[3]}</div></td><td>${c[2]}</td><td>${c[7]}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}`}
function scorePage(){let arr=[['attendance','Kehadiran',10],['uts','UTS',20],['uas','UAS',20],['daily_task','Tugas Harian',20],['group_task','Tugas Kelompok',20],['major_project','Tugas Besar',10]];let sum=arr.reduce((n,[k,_,w])=>n+scores[k]*w/100,0);let letter=sum>=85?'A':sum>=70?'B':sum>=55?'C':sum>=40?'D':'E';let quality={A:4,B:3,C:2,D:1,E:0}[letter];return `${head('DUAL ASSESSMENT ENGINE','Kalkulator PAP & CPL','Nilai dapat diubah. Hasil perhitungan diperbarui langsung (simulasi).')}<div class="details-grid"><div class="panel"><h2>Enam Komponen PAP</h2><div class="form-grid">${arr.map(([k,label,w])=>`<div class="field"><label>${label} · ${w}%</label><input type="number" class="input" min="0" max="100" value="${scores[k]}" oninput="scores.${k}=Math.min(100,Math.max(0,Number(this.value)||0));$('#scoreOutput').innerHTML=scoreOutput()"></div>`).join('')}</div><div id="scoreOutput">${scoreOutput()}</div></div><div class="panel"><h2>Matriks Ketuntasan CPL</h2><p class="subtle">Menggunakan UTS, UAS, Harian, Kelompok dan Besar tanpa kehadiran.</p><div id="cplResults">${cplOutput()}</div><div class="notice" style="margin-top:30px"><i>ⓘ</i><div><strong>Nilai simulasi</strong><p>Nilai nyata dihitung dari catatan nilai mahasiswa yang sudah tersimpan.</p></div></div></div></div>`;}
function scoreOutput(){let arr=[['attendance',10],['uts',20],['uas',20],['daily_task',20],['group_task',20],['major_project',10]];let sum=arr.reduce((n,[k,w])=>n+scores[k]*w/100,0);let letter=sum>=85?'A':sum>=70?'B':sum>=55?'C':sum>=40?'D':'E';let quality={A:4,B:3,C:2,D:1,E:0}[letter];let cpl=$('#cplResults');if(cpl)cpl.innerHTML=cplOutput();return `<div class="three-col" style="margin-top:25px"><div class="metric"><div class="metric-label">Nilai Akhir</div><div class="metric-value">${sum.toFixed(2)}</div></div><div class="metric"><div class="metric-label">Predikat</div><div class="metric-value">${letter}</div></div><div class="metric"><div class="metric-label">Mutu</div><div class="metric-value">${quality.toFixed(2)}</div></div></div>`}
function cplOutput(){let rows=[['CPL04',38,[[8,0,3,0,0],[12,0,3,0,4],[0,0,3,5,0]]],['CPL08',62,[[0,0,0,15,4],[0,10,3,5,7],[0,10,3,5,0]]]];return rows.map(([code,weight,ws])=>{let sum=ws.reduce((n,a)=>n+a[0]*scores.uts+a[1]*scores.uas+a[2]*scores.daily_task+a[3]*scores.group_task+a[4]*scores.major_project,0)/weight;return `<div class="bars-row"><span>${code}</span><div class="progress"><span style="width:${sum}%"></span></div><b>${sum.toFixed(1)}%</b></div>`}).join('')}
function rps(){return `${head('OTORISASI KURIKULUM','Status Validasi RPS','Sesuai data referensi delapan kelas pada PRD')}<div class="panel tight"><div class="table-scroll"><table class="table"><thead><tr><th>Mata Kuliah</th><th>Kelas</th><th>Validasi Kaprodi</th><th>Validasi Dekan</th><th>Status</th></tr></thead><tbody>${classes.map(c=>`<tr><td><strong>${c[1]}</strong></td><td>${c[2]}</td><td>${tag(c[11])}</td><td>${tag(c[11])}</td><td>${c[11]?'Aktif':'Menunggu RPS'}</td></tr>`).join('')}</tbody></table></div></div>`}
function fallback(){return `${head('INFORMASI AKADEMIK',menu.find(m=>m[0]===page)?.[1]||'Pengaturan','Mode pratinjau mandiri tidak terhubung ke server.')}<section class="panel"><div class="notice"><i>ⓘ</i><div><strong>Pratinjau antarmuka</strong><p>Notifikasi asli, pengelolaan akun, audit, dan penyimpanan perubahan memerlukan instalasi proyek full-stack beserta Supabase.</p></div></div></section>`}
const escapePreview=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let demoAnnouncements=[{title:'Informasi semester 2026/2027 Ganjil',body:'Pengumuman dari admin dan dosen kelas akan muncul di sini.',scope:'Umum',created:'Contoh'}];
let demoTasks=[{id:1,title:'Prototipe UI/UX Interaktif',description:'Kumpulkan tautan GitHub atau Google Drive dan dokumentasi desain. Anda dapat merevisi pengumpulan sebelum tenggat.',category:'Tugas Kelompok',due:'2026-12-20T23:59',course:'Interaksi Manusia & Komputer · TI25D'}];
let demoSubmission={status:'Belum dikumpulkan',content:'',links:[''],files:[],revision:0};
let demoNotifications=[{title:'Tugas baru',description:'Prototipe UI/UX Interaktif telah diterbitkan (simulasi).'}];
function demoToast(message){const node=$('#previewStatus');if(node){node.textContent=message;node.style.display='block'}else alert(message)}
function announcementsDemo(){return `${head('PUSAT INFORMASI','Pengumuman Akademik','Publikasi ke kelas atau seluruh kampus dan notifikasi pengguna (pratinjau).')}
<div class="preview-note">SIMULASI LOKAL — Pengumuman dan notifikasi di bawah tidak dikirim ke akun asli.</div>
${role!=='mahasiswa'?`<div class="panel"><div class="preview-heading"><h2>Buat pengumuman</h2><span class="preview-badge">Role ${role==='dosen'?'Dosen':'Admin'}</span></div><form class="preview-form" onsubmit="previewPublish(event)"><div class="field"><label>Judul</label><input id="previewTitle" class="input" required minlength="5" placeholder="Contoh: Ruangan perkuliahan diperbarui"></div><div class="field"><label>Isi pengumuman</label><textarea id="previewBody" rows="3" class="textarea" required minlength="10" placeholder="Tulis informasi akademik..."></textarea></div><button class="btn btn-primary">Terbitkan pengumuman (simulasi)</button></form></div>`:''}
<div id="previewStatus" class="feedback" style="display:none"></div><div class="preview-card-grid">${demoAnnouncements.map(a=>`<article class="panel"><span class="tag blue">${escapePreview(a.scope)}</span><h2 style="margin:14px 0 8px">${escapePreview(a.title)}</h2><p class="preview-text">${escapePreview(a.body)}</p><small class="subtle">${escapePreview(a.created)} · Mode pratinjau</small></article>`).join('')}</div>`}
function previewPublish(e){e.preventDefault();const title=$('#previewTitle').value.trim(),body=$('#previewBody').value.trim();demoAnnouncements.unshift({title,body,scope:role==='dosen'?'Kelas dosen':'Seluruh kampus',created:'Baru saja'});demoNotifications.unshift({title,description:body});render();demoToast('Pengumuman diterbitkan dalam simulasi. Notifikasi contoh ditambahkan.')}
function tasksDemo(){return `${head('AKTIVITAS AKADEMIK','Tugas & Pengumpulan','Pengumpulan bertahap, revisi, lampiran privat, GitHub dan Google Drive.')}
<div class="preview-note">SIMULASI LOKAL — Tidak menyimpan file ke Supabase. Formulir aslinya ada dalam proyek full-stack.</div>
${role==='dosen'?`<section class="panel"><div class="preview-heading"><h2>Buat tugas (dosen)</h2><span class="preview-badge">Penilaian PAP</span></div><form class="preview-form" onsubmit="previewNewTask(event)"><div class="field"><label>Judul tugas</label><input class="input" id="demoTaskTitle" minlength="5" required placeholder="Contoh: Laporan Analisis PL"></div><div class="field"><label>Instruksi</label><textarea class="textarea" id="demoTaskDesc" minlength="10" required rows="3"></textarea></div><div class="field"><label>Tenggat (WIB)</label><input class="input" type="datetime-local" id="demoTaskDue" required></div><button class="btn btn-primary">Terbitkan tugas (simulasi)</button></form></section>`:''}
<div class="preview-card-grid">${demoTasks.map(t=>`<article class="panel"><span class="tag blue">${escapePreview(t.category)}</span><h2 style="margin:15px 0 5px">${escapePreview(t.title)}</h2><p class="preview-note">${escapePreview(t.course)}</p><p class="preview-text">${escapePreview(t.description)}</p><p class="preview-note">Tenggat: ${escapePreview(t.due.replace('T',' '))} WIB</p>${role==='mahasiswa'?`<button class="btn btn-primary" onclick="previewOpenSubmission()">Buka pengumpulan</button>`:`<button class="btn btn-secondary" onclick="previewOpenSubmission()">Lihat pengumpulan contoh</button>`}</article>`).join('')}</div><div id="previewTaskDetail"></div>`}
function previewNewTask(e){e.preventDefault();demoTasks.unshift({id:Date.now(),title:$('#demoTaskTitle').value.trim(),description:$('#demoTaskDesc').value.trim(),category:'Tugas Harian',due:$('#demoTaskDue').value,course:'TI25D · Simulasi'});demoNotifications.unshift({title:'Tugas baru',description:demoTasks[0].title});render();demoToast('Tugas diterbitkan dalam simulasi, notifikasi contoh ditambahkan.')}
function previewOpenSubmission(){const body=role==='mahasiswa'?`<form class="preview-form" onsubmit="previewSubmit(event)"><div class="field"><label>Catatan hasil pengerjaan</label><textarea class="textarea" rows="4" id="demoSubmissionText" placeholder="Jelaskan apa yang Anda kerjakan...">${escapePreview(demoSubmission.content)}</textarea></div><div class="field"><label>Link proyek (bisa banyak)</label><div id="demoLinks">${demoSubmission.links.map((v,i)=>`<div class="preview-line"><input aria-label="Tautan ${i+1}" class="input demo-link" type="url" value="${escapePreview(v)}" placeholder="https://github.com/..." onchange="demoSubmission.links[${i}]=this.value"><button type="button" class="btn btn-secondary" onclick="previewRemoveLink(${i})">Hapus</button></div>`).join('')}</div><button type="button" class="btn btn-secondary btn-sm" onclick="previewPersistDraft();demoSubmission.links.push('');previewOpenSubmission()">+ Tambah tautan</button></div><div class="field"><label>Lampiran file (berapa pun file, masing-masing maksimal 10 MB)</label><input class="input" type="file" id="demoAttachment" multiple onchange="previewAttachFiles(this)"></div><div id="demoFileList">${previewFileList()}</div><div class="preview-actions"><button type="submit" class="btn btn-primary">${demoSubmission.revision?'Kumpulkan revisi':'Kumpulkan tugas'} (simulasi)</button></div></form>`: `<div class="preview-box"><strong>Daftar pengumpulan contoh</strong><p class="preview-note">Kondisi: ${escapePreview(demoSubmission.status)} · Revisi v${demoSubmission.revision}</p><p class="preview-text">${escapePreview(demoSubmission.content||'Belum ada catatan')}</p>${demoSubmission.links.filter(Boolean).map(v=>`<p class="preview-link">${escapePreview(v)}</p>`).join('')}${previewFileList()}</div>`;
$('#previewTaskDetail').innerHTML=`<section class="panel"><div class="preview-heading"><h2>${role==='mahasiswa'?'Pengumpulan Anda':'Pengumpulan mahasiswa'}</h2><span class="tag ${demoSubmission.status==='Dikumpulkan'?'good':'warn'}">${demoSubmission.status} · v${demoSubmission.revision}</span></div>${body}</section>`;$('#previewTaskDetail').scrollIntoView({behavior:'smooth',block:'start'});}
function previewFileList(){return demoSubmission.files.map((f,i)=>`<div class="preview-file"><span>📎 ${escapePreview(f.name)} <small>(${Math.ceil(f.size/1024)} KB)</small></span>${role==='mahasiswa'?`<button type="button" class="btn btn-secondary btn-sm" onclick="previewPersistDraft();demoSubmission.files.splice(${i},1);previewOpenSubmission()">Hapus</button>`:''}</div>`).join('')||'<p class="preview-note">Belum ada lampiran.</p>'}
function previewPersistDraft(){const editor=$('#demoSubmissionText');if(editor)demoSubmission.content=editor.value;const inputs=[...document.querySelectorAll('.demo-link')];if(inputs.length)demoSubmission.links=inputs.map(x=>x.value);}
function previewRemoveLink(i){previewPersistDraft();demoSubmission.links.splice(i,1);previewOpenSubmission()}
function previewAttachFiles(element){previewPersistDraft();for(const file of [...element.files]){if(file.size>10*1024*1024){demoToast(file.name+' melebihi 10 MB.');continue;}demoSubmission.files.push({name:file.name,size:file.size});}previewOpenSubmission()}
function previewSubmit(e){e.preventDefault();const urls=[...document.querySelectorAll('.demo-link')].map(x=>x.value.trim()).filter(Boolean);if(urls.some(u=>!u.startsWith('https://'))){demoToast('Tautan harus memakai HTTPS.');return;}demoSubmission.links=urls;demoSubmission.content=$('#demoSubmissionText').value;demoSubmission.status='Dikumpulkan';demoSubmission.revision++;render();previewOpenSubmission();demoToast('Pengumpulan tersimpan sebagai simulasi. Anda dapat mengedit kembali.');}
function scheduleAuditDemo(){if(role!=='admin'&&role!=='super_admin')return '';return `<div class="panel"><div class="panelhead"><h2>Audit Bentrok Jadwal</h2><span class="tag blue">Simulasi pemeriksaan</span></div><div class="form-grid"><div class="field"><label>Hari</label><select id="confDay" class="select"><option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option></select></div><div class="field"><label>Jam mulai</label><input class="input" type="time" id="confStart" value="10:00"></div><div class="field"><label>Jam selesai</label><input class="input" type="time" id="confEnd" value="12:00"></div><div class="field"><label>Ruangan</label><input class="input" id="confRoom" value="G. Mahdar R. D 406"></div></div><button class="btn btn-primary" style="margin-top:13px" onclick="previewCheckClash()">Periksa bentrok</button><div id="confFeedback" style="margin-top:12px"></div></div>`}
function previewCheckClash(){const day=$('#confDay').value,start=$('#confStart').value,end=$('#confEnd').value,room=$('#confRoom').value.trim().toLowerCase();const conflicts=classes.filter(c=>c[4]===day&&c[5]<end&&c[6]>start&&c[7].toLowerCase()===room);$('#confFeedback').innerHTML=conflicts.length?conflicts.map(c=>`<div class="preview-check"><strong>Bentrok ruangan</strong><p>${escapePreview(c[1])} · ${escapePreview(c[2])} · ${escapePreview(c[5])}–${escapePreview(c[6])}</p></div>`).join(''):'<div class="tag good">Tidak ditemukan bentrok ruangan pada data contoh.</div>'}
function render(){setup();$('#screen').innerHTML=page==='dashboard'?dashboard():page==='kelas'?classPage():page==='detail'?detailPage():page==='jadwal'?schedule()+scheduleAuditDemo():page==='tugas'?tasksDemo():page==='pengumuman'?announcementsDemo():page==='nilai'?scorePage():page==='rps'?rps():page==='notifikasi'?`${head('NOTIFIKASI AKADEMIK','Notifikasi','Informasi otomatis kelas dan pengumuman (simulasi).')}<div class='panel'>${demoNotifications.map(n=>`<div class='notify-row'><span class='dot'></span><div><strong>${escapePreview(n.title)}</strong><p>${escapePreview(n.description)}</p></div></div>`).join('')}</div>`:fallback()}
$('#role').onchange=e=>{role=e.target.value;go('dashboard')};function tick(){let s=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());$('#clock').textContent=s+' WIB'}tick();setInterval(tick,12000);render();
</script></body></html>
